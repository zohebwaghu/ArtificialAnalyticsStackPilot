services:
  stackpilot:
    build:
      context: .
      target: deps
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0
    init: true
    ports:
      - "${STACKPILOT_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - stackpilot_node_modules:/app/node_modules

volumes:
  stackpilot_node_modules:
